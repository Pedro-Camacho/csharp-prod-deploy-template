name: entrega

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Testes da loja
        run: dotnet test LojaProducao.slnx -c Release --verbosity quiet

  publish:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Definir namespace em minusculas
        id: namespace
        run: echo "value=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e push da web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: LojaGraphQL.Api/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.namespace.outputs.value }}/web:${{ github.sha }}

      - name: Build e push do worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: LojaGraphQL.Worker/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.namespace.outputs.value }}/worker:${{ github.sha }}

      - name: Resumo da publicacao
        run: |
          {
            echo "## Imagens publicadas"
            echo "- Namespace: \`${{ steps.namespace.outputs.value }}\`"
            echo "- Versao (commit): \`${{ github.sha }}\`"
            echo "- \`ghcr.io/${{ steps.namespace.outputs.value }}/web:${{ github.sha }}\`"
            echo "- \`ghcr.io/${{ steps.namespace.outputs.value }}/worker:${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
